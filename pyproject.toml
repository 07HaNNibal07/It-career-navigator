[project]
name = "it-career-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HaNNibal", email = "babaevilgar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
it-career-navigator = "it_career_navigator:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
