<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IT Career Navigator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='autocomplete.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='profile-dashboard.css') }}">
</head>
<body>
  <header class="header">
    <a class="brand" href="/">IT Career Navigator</a>
    <nav>
      {% if user %}
        <a href="/profile">Профиль</a>
        <a href="/analyses">Анализы</a>
        <form class="inline" action="/logout" method="post"><button class="link-button">Выйти</button></form>
      {% else %}
        <a href="/login">Войти</a>
        <a class="button small" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
