{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="form-card narrow">
  <h1>Регистрация</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Имя<input name="name" required maxlength="50"></label>
    <label>Фамилия<input name="surname" required maxlength="50"></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Возраст<input name="age" type="number" min="1" required></label>
    <label>Телефон<input name="phone" required maxlength="20"></label>
    <label>Пароль<input name="password" type="password" required minlength="8"></label>
    <button class="button" type="submit">Создать аккаунт</button>
  </form>
  <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</section>
{% endblock %}
